[build]
builder = "NIXPACKS"

[deploy]
startCommand = "gunicorn \"app:create_app('production')\" --workers 2 --timeout 120 --bind 0.0.0.0:$PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "web"

[services.env]
FLASK_ENV = "production"
