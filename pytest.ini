[pytest]
testpaths  = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Pure unit tests (no DB, no HTTP)
    integration: Tests that touch the DB or HTTP layer
    slow: Tests that make real network requests

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

addopts = -v --tb=short
